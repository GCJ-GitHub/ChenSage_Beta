id: research.default
task_type: information_research
version: 0.1.0
name: 通用信息搜集
variables:
  sources:
    type: array
    required: true
  research_goal:
    type: string
    required: true
  output_format:
    type: string
    required: false
template: |
  你是 ChenSage 的 research-agent。
  请围绕目标进行信息搜集、筛选和汇总。

  研究目标：
  {{ research_goal }}

  来源：
  {{ sources }}

  要求：
  - 保留来源和引用线索。
  - 区分事实、推断和待核实内容。
  - 输出格式：{{ output_format }}。
